name: Skrydžiai
run-name: ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.veiksmas, inputs.id) || github.event_name }}

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"   # kas 6 val. (~2, 8, 14, 20 val. Lietuvos žiemos laiku)
  workflow_dispatch:
    inputs:
      veiksmas:
        description: "tikrinti = išsaugotos kryptys ir sekami skrydžiai; kryptis = paieška iš programėlės; visi = plati paieška (~1 val.)"
        type: choice
        options: [tikrinti, kryptis, visi]
        default: tikrinti
      id:
        description: "Paieškos ID (pildo programėlė)"
        type: string
        default: ""
      uzklausa:
        description: "Užšifruota užklausa (pildo programėlė)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["docs/**", "!docs/paieskos.enc"]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

jobs:
  # Programėlės kodo pakeitimai -> GitHub Pages
  pages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: { group: pages, cancel-in-progress: true }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

  # Kainų rinkimas ir pranešimai. Rezultatai — šakoje „duomenys“ (tik užšifruoti, be istorijos)
  darbas:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Paieškos kryptimi vyksta lygiagrečiai (kiekviena savo grupėje); tikrinimai ir plati paieška — po vieną
    concurrency:
      group: darbas-${{ inputs.veiksmas == 'kryptis' && inputs.id || inputs.veiksmas || 'tikrinti' }}
      cancel-in-progress: false
    env:
      SLAPTAZODIS: ${{ secrets.SLAPTAZODIS }}
      VEIKSMAS: ${{ inputs.veiksmas || 'tikrinti' }}
      UZKLAUSA: ${{ inputs.uzklausa }}
      DATA_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests

      - name: Duomenų šaka
        run: |
          if git ls-remote --exit-code --heads origin duomenys > /dev/null; then
            git clone --quiet --depth 1 --branch duomenys "$DATA_URL" data
          else
            mkdir data
          fi

      - name: Planas
        run: node collector/darbas.mjs planas

      - name: Rinkti kainas
        run: |
          if [ "$VEIKSMAS" = "visi" ]; then
            python collector/rinkti_kainas.py --out build/kainos.json --oro-uostai data/oro_uostai.json
          elif [ -f build/plan.json ]; then
            python collector/rinkti_kainas.py --plan build/plan.json --out build/kainos.json --oro-uostai data/oro_uostai.json
          else
            python collector/rinkti_kainas.py --tik-oro-uostai --oro-uostai data/oro_uostai.json
          fi

      - name: Įvertinti ir pranešti
        run: node collector/darbas.mjs po

      # Į naujausią šakos versiją perkeliami tik šio paleidimo failai (kiti paleidimai galėjo ją pakeisti)
      - name: Išsaugoti duomenis
        run: |
          [ -f data/oro_uostai.json ] && echo "oro_uostai.json" >> build/rasyti.txt
          touch build/rasyti.txt build/trinti.txt
          [ -s build/rasyti.txt ] || [ -s build/trinti.txt ] || { echo "Nėra ką išsaugoti."; exit 0; }
          for i in 1 2 3 4 5; do
            rm -rf fresh
            if git ls-remote --exit-code --heads "$DATA_URL" duomenys > /dev/null; then
              git clone --quiet --depth 1 --branch duomenys "$DATA_URL" fresh
              base=$(git -C fresh rev-parse HEAD)
            else
              mkdir fresh && git -C fresh init --quiet && base=""
            fi
            while read -r f; do [ -n "$f" ] && mkdir -p "fresh/$(dirname "$f")" && cp "data/$f" "fresh/$f"; done < build/rasyti.txt
            while read -r f; do [ -n "$f" ] && rm -f "fresh/$f"; done < build/trinti.txt
            cd fresh
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --quiet --orphan naujas
            git add -A
            git commit --quiet -m "Duomenys" || exit 0
            if [ -n "$base" ]; then lease="--force-with-lease=duomenys:$base"; else lease=""; fi
            if git push --quiet $lease "$DATA_URL" naujas:duomenys; then exit 0; fi
            cd ..
            echo "Šaką ką tik pakeitė kitas paleidimas — bandau dar kartą"; sleep $((i * 5))
          done
          exit 1
